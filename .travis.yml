sudo: false
arch:
 - amd64
language: node_js
node_js:
  - "24"
  - "10"
  - "12"
  - "14"
before_install:
  - rm -f package-lock.json
script:
  - |
    if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 18 ]; then
      npm test
    else
      node node_modules/.bin/tape test/bash-comparison.js test/dollar.js test/empty-option.js test/ghsa-6j4f-fj2g-mc7p.js test/ghsa-qhr7-859c-m2p7.js test/negative-increment.js test/nested.js test/order.js test/pad.js test/same-type.js test/sequence.js
    fi
